name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ZIG_VERSION: 0.16.0

jobs:
  # Debug catches safety faults; ReleaseSafe checks optimized code and timing on each host.
  # The arithmetic and byte budgets are mode-independent; the encoder ratios are printed, not asserted.
  # The full test target already builds and runs the examples.
  test:
    name: test (${{ matrix.os }}, ${{ matrix.optimize }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        optimize: [Debug, ReleaseSafe]
        include:
          # One unchecked run catches optimizer-dependent behaviour; the other hosts have ReleaseSafe.
          - os: ubuntu-latest
            optimize: ReleaseFast
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Test — ${{ matrix.optimize }}
        run: zig build test -Doptimize=${{ matrix.optimize }}

  # ReleaseSmall must build; its unchecked tests add no distinct assertion to ReleaseFast.
  small:
    name: compile (ReleaseSmall)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig build check -Doptimize=ReleaseSmall

  # Formatting and source-policy checks read the same files on every host; once is enough.
  source:
    name: source checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Formatting
        run: zig fmt --check build.zig build.zig.zon src examples conformance

  # morse calls no operating system API, so the same source builds wherever
  # Zig goes. One host is enough to say so, and it is the claim the README
  # makes. `check` is what makes the claim mean something: it compiles the
  # suite and the examples for the target and runs neither, where a bare
  # `zig build` would have installed nothing and compiled nothing.
  cross:
    name: cross (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-linux-gnu
          - aarch64-linux-gnu
          - x86_64-windows-gnu
          - aarch64-windows-gnu
          - x86_64-macos
          - aarch64-macos
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig build check -Dtarget=${{ matrix.target }}

  # The writers, fed to a terminal emulator built from source, and its
  # replies read back through this package's parsers. Its own job because it
  # is the only thing here that fetches anything, and because a failure in it
  # says something different from a failure above: the bytes are what the
  # specification says and a terminal still did not do what was asked.
  #
  # Windows is missing because the emulator's own supported hosts are the two
  # here; the bytes it is fed do not vary by host.
  conformance:
    name: conformance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Conformance
        run: zig build conformance

  # README.md's Usage block is a region of examples/usage.zig, which the job
  # above runs. This is what keeps the two the same thing. No Zig needed.
  readme:
    name: README usage block
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: ci/check-readme.sh
      # every cast out of the type system says why it is safe
      - run: python3 ci/casts.py
